# Copy this file to config/settings.toml (gitignored) and fill in your setup.

camera_index = 0
occupancy_threshold = 18.0

# Optional: save the live PGN to a local file in this folder as the game
# progresses. Independent of Lichess -- works with or without round_id/
# LICHESS_API_TOKEN configured. Comment out (or omit) to disable.
pgn_save_folder = "games"

# The Lichess broadcast round to push moves to (find it in the round's URL).
# Optional -- omit (along with LICHESS_API_TOKEN) to run with local saving only.
round_id = "abcd1234"

# PGN headers. White/Black must match the player names already configured
# for this board in the Lichess broadcast round -- Lichess matches by name.
event = "Live Broadcast"
site = "?"
white = "White Player"
black = "Black Player"
round = "1"
