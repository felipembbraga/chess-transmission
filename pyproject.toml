[project]
name = "chess-transmission"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Felipe Mendes Braga", email = "felipe.mendes.braga@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "berserk>=0.14.0",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "python-chess>=1.999",
    "python-dotenv>=1.2.2",
]

[project.scripts]
chess-transmission = "chess_transmission.cli.main:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "responses>=0.26.2",
]
